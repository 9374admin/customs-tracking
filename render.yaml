services:
  - type: web
    name: customs-tracking
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: customs-db
          property: connectionString

databases:
  - name: customs-db
    plan: free
    databaseName: customs
